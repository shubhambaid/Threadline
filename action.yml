# Validates .alethic/ records in CI. No model connection is needed.
#
# Use a full clone (actions/checkout with fetch-depth: 0) so evidence commits can be checked.
# In a shallow clone, missing commits are reported as warnings, or as errors with strict: "true".
name: Alethic validate
description: Validate Alethic shared-memory records (.alethic/) for schema, provenance, privacy, and lease problems.
branding:
  icon: check-circle
  color: blue

inputs:
  working-directory:
    description: Directory of the repository that contains .alethic/
    required: false
    default: "."
  strict:
    description: Treat missing evidence commits as errors ("true" or "false")
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 22

    - name: Build Alethic
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --no-audit --no-fund && npm run build

    - name: Validate records
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        ALETHIC_CLI: ${{ github.action_path }}/dist/cli.js
        ALETHIC_STRICT: ${{ inputs.strict }}
      run: |
        args=(validate)
        if [ "$ALETHIC_STRICT" = "true" ]; then args+=(--strict); fi
        node "$ALETHIC_CLI" "${args[@]}"
