name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Smoke test the built CLI
        run: |
          node dist/cli.js --version
          node dist/cli.js --help

  action:
    name: Validate action self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Create a sample repository with Threadline state
        run: |
          npm ci
          npm run build
          mkdir -p "$RUNNER_TEMP/sample"
          cd "$RUNNER_TEMP/sample"
          git init -q -b main
          git -c user.name=ci -c user.email=ci@threadline.invalid commit -q --allow-empty -m init
          node "$GITHUB_WORKSPACE/dist/cli.js" init
      - uses: ./
        with:
          working-directory: ${{ runner.temp }}/sample
          strict: "true"
